spring.config.import=optional:file:env/.env[.properties],optional:file:backend/env/.env[.properties],optional:file:TekkieStoreCapstone/backend/env/.env[.properties]
spring.application.name=TekkieStoreCapstone

# Uses the separate test database when TEST_DB_URL is in your .env, otherwise the main DB_* database
spring.datasource.url=${TEST_DB_URL:${DB_URL}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
 

# Cloudinary Configuration (3rd-Party Media Integration)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Spring's multipart defaults (1MB/10MB) are too small for real product photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Paystack test mode (no real money). A blank key just disables checkout.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.frontend-url=${FRONTEND_URL:http://localhost:5173}
